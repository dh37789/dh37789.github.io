<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
  {% include head.html %}

  <body>
    {% include sidebar.html %}

    <div class="wrap">
      <header class="masthead">
        <div class="container">
          <h3 class="masthead-title">
            <a href="{{ '/' | relative_url }}" title="홈">{{ site.title }}</a>
            <small>{{ site.tagline }}</small>
          </h3>
        </div>
      </header>

      <main id="main-content" class="container content">
        {{ content }}
      </main>
    </div>

    <label
      for="sidebar-checkbox"
      class="sidebar-toggle"
      aria-label="메뉴 열기"
      aria-controls="sidebar"
      aria-expanded="false"
    ></label>

    <script src="{{ '/public/js/script.js' | relative_url }}" defer></script>
  </body>
</html>
